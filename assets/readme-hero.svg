    <text x="270" y="145" font-size="54" font-weight="800" fill="#F4FAFF">PROJECT TEMPLATE</text>
    <text x="272" y="190" font-size="24" font-weight="500" fill="#B8D2E0">A clear foundation for your next software project.</text>
    <text x="272" y="232" font-size="16" font-weight="600" letter-spacing="1.4" fill="#62E5FF">STRUCTURE  ·  CI  ·  DEPENDABOT  ·  RELEASES</text>
