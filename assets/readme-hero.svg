<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SWIR Project Template</title>
  <desc id="desc">SWIR software project template, presented in a dark electric-cyan banner with a layered code window icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="0.56" stop-color="#07111C"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="0.5" stop-color="#62E5FF"/>
      <stop offset="1" stop-color="#0088FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.28"/>
  <path d="M0 270C180 230 300 300 490 268S780 235 960 270S1110 275 1200 248" fill="none" stroke="url(#cyan)" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M940 45H1140" stroke="#62E5FF" stroke-opacity="0.16"/>
  <g transform="translate(68 72)">
    <rect width="156" height="156" rx="32" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.55"/>
    <rect x="25" y="25" width="88" height="90" rx="12" fill="none" stroke="#0088FF" stroke-width="3" stroke-opacity="0.6"/>
    <rect x="39" y="41" width="92" height="90" rx="12" fill="#07111C" stroke="#62E5FF" stroke-width="3"/>
    <path d="M40 63H130" stroke="#62E5FF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="52" cy="52" r="3" fill="#62E5FF"/>
    <circle cx="63" cy="52" r="3" fill="#0088FF"/>
    <path d="M70 81L57 94L70 107M101 81L114 94L101 107M91 77L81 112" fill="none" stroke="#62E5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
