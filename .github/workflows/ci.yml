name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources when present
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            python -m compileall -q .
          else
            echo "No Python files found; syntax check skipped."
          fi

      - name: Repository sanity checks
        shell: bash
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f ROADMAP.md
          echo "Repository checks passed."
